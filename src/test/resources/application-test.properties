spring.application.name=GestionMedicale-Test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.flyway.enabled=false
# Utiliser un cache simple en mémoire pour les tests au lieu de Redis
spring.cache.type=simple
# Désactiver Redis si nécessaire
spring.data.redis.host=localhost
jwt.secret=TestSecretKeyForSecurityPurposesOnlyMustBeLongEnough123!
jwt.expiration=3600000
