spring.application.name=GestionMedicale-Test

# H2 Database - On utilise une base en mémoire ultra rapide pour les tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Désactiver Flyway (pas besoin car Hibernate crée les tables pour nous en test)
spring.flyway.enabled=false

# Désactiver Redis et exclure ses configurations
spring.cache.type=none
spring.data.redis.repositories.enabled=false


# Sécurité / JWT (Indispensable pour que le contexte Spring démarre)
jwt.secret=MaSuperCleSecreteTresLonguePourLesTests1234567890
jwt.expiration=3600000