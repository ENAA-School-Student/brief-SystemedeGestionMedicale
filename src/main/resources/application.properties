spring.application.name=SystemeGestionMedicale
server.port=${PORT:8080}


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:systemegestionMedicale}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
