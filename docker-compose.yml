version: "3.7"

services:
  app:
    build: .
    container_name: spring_boot_app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - 8080:8080
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/systemegestionmedicale
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: nouha23
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      - app_network

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    ports:
      - 3307:3306
    networks:
      - app_network
    environment:
      MYSQL_DATABASE: systemegestionmedicale
      MYSQL_ROOT_PASSWORD: nouha23
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pnouha23"]
      timeout: 5s
      retries: 10
      interval: 10s

  redis:
    image: redis:latest
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - app_network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    ports:
      - "8001:8001"
    networks:
      - app_network

networks:
  app_network:

volumes:
  db_data: